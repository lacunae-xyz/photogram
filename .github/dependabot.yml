version: 2
# The design system lives on GitHub Packages. A Dependabot secret: a classic token with read:packages.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies: { dependency-type: development, update-types: [minor, patch] }
      dependencies: { dependency-type: production, update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }
