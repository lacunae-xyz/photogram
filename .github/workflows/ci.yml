name: CI

on:
  push:
    branches: [master]
  pull_request:
    # labeled: the update-snapshots / update-budgets labels. Dispatch only works once ci.yml is on master.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly: adds the @slow 3000-row perf scenarios.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate screenshot baselines on the CI runner and upload them
        type: boolean
        default: false
      update-budgets:
        description: Measure perf budgets on the CI runner (5 runs, slow scenarios included) and upload budgets.json
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    # npm ci installs @lacunae-xyz/photogram-design-system from GitHub Packages.
    permissions:
      contents: read
      packages: read
    # Vitest browser mode runs the Lit element tests in the image's Chromium, which only fits the same Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - name: Playwright versions match the image tag
        run: |
          node -e '
            const fs = require("fs");
            const versions = {
              "package-lock.json playwright": require("./package-lock.json").packages["node_modules/playwright"].version,
              "e2e/package.json @playwright/test": require("./e2e/package.json").devDependencies["@playwright/test"],
              "e2e/package-lock.json @playwright/test": require("./e2e/package-lock.json").packages["node_modules/@playwright/test"].version,
            };
            // Every image reference counts, so a tag in another form (no v, latest, digest) fails instead of being skipped.
            const tags = [...fs.readFileSync(".github/workflows/ci.yml", "utf8").matchAll(/mcr\.microsoft\.com\/playwright:(\S+)/g)];
            tags.forEach(([, tag], i) => {
              versions["ci.yml image " + (i + 1) + " " + tag] = (/^v(\d+\.\d+\.\d+)(?![\d.])/.exec(tag) || [, tag])[1];
            });
            console.table(versions);
            // A missing package fails above or differs; an image count would need a bump each time a job is added or removed.
            if (!tags.length) {
              console.log("::error file=.github/workflows/ci.yml::No mcr.microsoft.com/playwright image found in ci.yml");
              process.exit(1);
            }
            if (new Set(Object.values(versions)).size > 1) {
              console.log("::error file=.github/workflows/ci.yml::Playwright versions differ: bump the image tags with the packages");
              process.exit(1);
            }
          '
      # The image's Node, same as .nvmrc. setup-node writes the GitHub Packages auth and restores the npm cache.
      - uses: actions/setup-node@v5
        with:
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lacunae-xyz'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test -- --coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node e2e/support/coverage-summary.mjs vitest=coverage/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-vitest
          path: coverage/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    # npm ci installs @lacunae-xyz/photogram-design-system from GitHub Packages.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lacunae-xyz'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build:
    runs-on: ubuntu-latest
    # npm ci installs @lacunae-xyz/photogram-design-system from GitHub Packages.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lacunae-xyz'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      # Maps for the Playwright coverage, from a second build, so the deployed dist stays a plain build. The design
      # system's maps take coverage on to its src.
      - run: npm run build:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: dist-maps
          path: |
            dist-maps/**/*.map
            node_modules/@lacunae-xyz/photogram-design-system/dist/**/*.js.map
          if-no-files-found: error
          retention-days: 1

  # Pull requests: the base build, which the Perf step measures the PR's against. Runs alongside build.
  build-base:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'update-budgets')
    runs-on: ubuntu-latest
    # A base that doesn't build leaves the Perf step on its absolute budgets rather than failing the PR.
    continue-on-error: true
    # Bases from before the design system left the repo install it from their workspace, later ones from GitHub
    # Packages: the registry setup serves both.
    permissions:
      contents: read
      packages: read
    steps:
      # The merge commit build measures, then its first parent, so A and B differ by exactly the PR's changes.
      # pull_request.base.sha can lag the base the merge commit was made on.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check out the merge commit's first parent
        run: |
          git rev-parse --verify --quiet HEAD^2 >/dev/null || { echo "::error::$(git rev-parse HEAD) is not a merge commit"; exit 1; }
          git checkout --detach HEAD^1
          echo "Base: $(git log -1 --format='%H %s')"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lacunae-xyz'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-base
          path: dist/
          retention-days: 1

  browser:
    needs: [build, build-base]
    # build-base is skipped outside pull requests and may fail: only build is required.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Same tag as unit, which checks it against the Playwright packages. The image ships Node 26, same as .nvmrc.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      HOME: /root
      UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots || contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
      UPDATE_BUDGETS: ${{ inputs.update-budgets || contains(github.event.pull_request.labels.*.name, 'update-budgets') }}
    defaults:
      run:
        working-directory: e2e
    steps:
      # The Playwright image ships git but not git-lfs, which the baselines need.
      - run: apt-get update && apt-get install -y --no-install-recommends git-lfs
        working-directory: /
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      # dist-maps/ and node_modules/@lacunae-xyz/photogram-design-system/dist/, at the checkout's root.
      # Kept 1 day: after that, re-run all jobs, not just this one.
      - uses: actions/download-artifact@v5
        with:
          name: dist-maps
      - uses: actions/download-artifact@v5
        if: ${{ needs.build-base.result == 'success' }}
        # No base build (or expired on a re-run): the Perf step falls back to the absolute budgets.
        continue-on-error: true
        with:
          name: build-base
          path: base-dist
      - id: install
        run: npm ci
      - run: npm run typecheck
      - run: npm run test:gate
      - name: Screenshots and e2e
        run: npx playwright test --project=screenshots --project=e2e --project=e2e-firefox --project=e2e-webkit ${{ env.UPDATE_SNAPSHOTS == 'true' && '--update-snapshots' || '' }}
        # Chromium projects only: Firefox and WebKit have no coverage API. Never on Perf, coverage slows what it measures.
        env:
          PW_COVERAGE: 1
          PW_COVERAGE_ARGS: --dist ../dist-maps
      - name: Perf
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Own output dir: a second run wipes test-results/ and the traces of the first.
        # Pull requests: blocking time against the base build measured in this job (A/B), not against budgets.json,
        # whose absolute values can't tell a slower runner from a regression. LayoutCount stays on budgets.json.
        run: |
          if [ "$UPDATE_BUDGETS" = true ]; then
            node perf/update-budgets.mjs --output=test-results-perf
          elif [ -f ../base-dist/index.html ]; then
            node perf/check-budgets.mjs --baseline ../base-dist --output=test-results-perf
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              # A failed job with continue-on-error can still report success: the artifact is what counts.
              echo "::warning::No base build to measure against (build-base job: $BUILD_BASE, no build-base artifact): total blocking time checked against budgets.json"
            fi
            node perf/check-budgets.mjs --output=test-results-perf
          fi
        env:
          BUILD_BASE: ${{ needs.build-base.result }}
          PERF_SLOW: ${{ (github.event_name == 'schedule' || env.UPDATE_BUDGETS == 'true') && '1' || '' }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-perf
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node support/coverage-summary.mjs screenshots=../coverage/e2e/screenshots/coverage-summary.json e2e=../coverage/e2e/e2e/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-e2e
          path: coverage/e2e/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-perf/
            e2e/test-results/
            e2e/test-results-perf/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.UPDATE_SNAPSHOTS == 'true' }}
        with:
          name: screenshot-baselines
          path: |
            e2e/screenshots/__screenshots__/
            e2e/specs/__screenshots__/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.UPDATE_BUDGETS == 'true' }}
        with:
          name: perf-budgets
          path: e2e/perf/budgets.json

  deploy-preview:
    needs: [unit, lint, build, browser]
    # Dependabot and fork PRs don't get the Netlify secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Deploy
        id: deploy
        # Explicit bash adds pipefail, so a failed deploy isn't hidden behind jq.
        shell: bash
        run: |
          url=$(npx --yes netlify-cli@27.19.0 deploy --no-build --dir=dist --alias=pr-${{ github.event.number }} --json | jq -r '.deploy_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Comment the preview URL
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}

  # serve doesn't read netlify.toml: the redirects and headers only exist once Netlify serves the build.
  preview-netlify:
    needs: deploy-preview
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      HOME: /root
      BASE_URL: ${{ needs.deploy-preview.outputs.url }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test --project=e2e --grep "on Netlify" specs/routes.spec.ts

  deploy-production:
    needs: [unit, lint, build, browser]
    # build-base only runs on PRs. Without explicit results, the implicit
    # success() sees it skipped upstream of browser and skips the deploy.
    if: >-
      !cancelled() &&
      needs.unit.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      needs.browser.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - run: npx --yes netlify-cli@27.19.0 deploy --no-build --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
