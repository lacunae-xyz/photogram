name: CI

on:
  push:
    branches: [master]
  pull_request:
    # labeled: the update-snapshots / update-budgets labels. Dispatch only works once ci.yml is on master.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly: adds the @slow 3000-row perf scenarios.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate screenshot baselines on the CI runner and upload them
        type: boolean
        default: false
      update-budgets:
        description: Measure perf budgets on the CI runner (5 runs, slow scenarios included) and upload budgets.json
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  browser:
    needs: build
    runs-on: ubuntu-latest
    # Keep the tag in sync with @playwright/test in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      HOME: /root
      UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots || contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
      UPDATE_BUDGETS: ${{ inputs.update-budgets || contains(github.event.pull_request.labels.*.name, 'update-budgets') }}
    defaults:
      run:
        working-directory: e2e
    steps:
      # The Playwright image ships git but not git-lfs, which the baselines need.
      - run: apt-get update && apt-get install -y --no-install-recommends git-lfs
        working-directory: /
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - id: install
        run: npm ci
      - run: npm run typecheck
      - name: Screenshots and e2e
        run: npx playwright test --project=screenshots --project=e2e --project=e2e-firefox --project=e2e-webkit ${{ env.UPDATE_SNAPSHOTS == 'true' && '--update-snapshots' || '' }}
      - name: Perf
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Own output dir: a second run wipes test-results/ and the traces of the first.
        run: |
          if [ "$UPDATE_BUDGETS" = true ]; then
            node perf/update-budgets.mjs --output=test-results-perf
          else
            npx playwright test --project=perf --workers=1 --output=test-results-perf
          fi
        env:
          PERF_SLOW: ${{ (github.event_name == 'schedule' || env.UPDATE_BUDGETS == 'true') && '1' || '' }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-perf
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-perf/
            e2e/test-results/
            e2e/test-results-perf/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.UPDATE_SNAPSHOTS == 'true' }}
        with:
          name: screenshot-baselines
          path: |
            e2e/screenshots/__screenshots__/
            e2e/specs/__screenshots__/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.UPDATE_BUDGETS == 'true' }}
        with:
          name: perf-budgets
          path: e2e/perf/budgets.json

  deploy-preview:
    needs: [unit, lint, build, browser]
    # Dependabot and fork PRs don't get the Netlify secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Deploy
        id: deploy
        # Explicit bash adds pipefail, so a failed deploy isn't hidden behind jq.
        shell: bash
        run: |
          url=$(npx --yes netlify-cli@27.19.0 deploy --no-build --dir=dist --alias=pr-${{ github.event.number }} --json | jq -r '.deploy_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Comment the preview URL
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}

  deploy-production:
    needs: [unit, lint, build, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - run: npx --yes netlify-cli@27.19.0 deploy --no-build --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
