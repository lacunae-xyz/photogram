# Deploys run from GitHub Actions (netlify-cli deploy --dir=dist). Netlify auto-builds are off.
[build]
  publish = "dist"

# Fixor moved to its own site. Its photogram route had no subpaths: anything under it goes to Fixor's home.
[[redirects]]
  from = "/fixor"
  to = "https://fixor.photogram.app/"
  status = 301

[[redirects]]
  from = "/fixor/*"
  to = "https://fixor.photogram.app/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
