# Deploys run from GitHub Actions (netlify-cli deploy --dir=dist). Netlify auto-builds are off.
[build]
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

# No X-Frame-Options or frame-ancestors: Fixor iframes photogram.app/fixor from fixor.photogram.app until phase 7.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
